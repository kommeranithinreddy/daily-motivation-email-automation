name: Daily Motivation Email

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  

permissions:
  contents: write

concurrency:
  group: daily-motivation-email
  cancel-in-progress: false

jobs:
  send-motivation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure recipients
        env:
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          python -c "import json, os; json.dump(json.loads(os.environ['RECIPIENTS_JSON']), open('data/recipients.json', 'w', encoding='utf-8'), indent=2)"

      - name: Send daily motivation
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python -m src.main

      - name: Persist daily record
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_sent_date.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record daily motivation email date"
            git push origin HEAD:main
          else
            echo "No daily record changes to commit."
          fi
